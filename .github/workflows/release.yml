# Publishes a tagged release. See RELEASING.md for the one-time setup.
#
#   aside-ads         -> PyPI (Trusted Publishing, environment "pypi")
#   aside-ads-client  -> PyPI (Trusted Publishing, environment "pypi-client")
#   aside-ads (npm)   -> npm (NPM_TOKEN secret, with provenance)
#   server image      -> ghcr.io/pritom14/aside-ads (GITHUB_TOKEN)
#
# A publish job whose credential is not configured is skipped with a notice
# instead of failing, so the other targets still go out.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  preflight:
    name: Check versions and credentials
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm: ${{ steps.creds.outputs.npm }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches every package version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          server=$(python3 -c 'import re,sys; print(re.search(r"__version__ = \"([^\"]+)\"", open(sys.argv[1]).read())[1])' src/aside_ads/__init__.py)
          client=$(python3 -c 'import re,sys; print(re.search(r"__version__ = \"([^\"]+)\"", open(sys.argv[1]).read())[1])' sdks/python/src/aside_ads_client/__init__.py)
          js=$(node -p 'require("./sdks/js/package.json").version')
          echo "tag=$tag aside-ads=$server aside-ads-client=$client npm aside-ads=$js"
          for v in "$server" "$client" "$js"; do
            if [ "$v" != "$tag" ]; then
              echo "::error::Tag v$tag does not match package versions ($server, $client, $js). See RELEASING.md."
              exit 1
            fi
          done
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - name: Check which credentials are configured
        id: creds
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "npm=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN secret is not set; the npm publish job will be skipped."
          fi

  build-python:
    name: Build Python distributions
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build --outdir dist/aside-ads .
      - run: python -m build --outdir dist/aside-ads-client sdks/python
      - run: twine check --strict dist/*/*
      - uses: actions/upload-artifact@v7
        with:
          name: aside-ads
          path: dist/aside-ads/
      - uses: actions/upload-artifact@v7
        with:
          name: aside-ads-client
          path: dist/aside-ads-client/

  pypi-aside-ads:
    name: Publish aside-ads to PyPI
    needs: build-python
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aside-ads/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the PyPI trusted publisher
        id: tp
        run: .github/scripts/check-pypi-publisher.sh
      - uses: actions/download-artifact@v8
        if: steps.tp.outputs.configured == 'true'
        with:
          name: aside-ads
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.tp.outputs.configured == 'true'
        with:
          skip-existing: true # re-runs after adding a missing credential stay safe

  pypi-aside-ads-client:
    name: Publish aside-ads-client to PyPI
    needs: build-python
    runs-on: ubuntu-latest
    # PyPI does not accept two pending publishers with the same repository, workflow and
    # environment, so the client uses its own environment.
    environment:
      name: pypi-client
      url: https://pypi.org/project/aside-ads-client/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the PyPI trusted publisher
        id: tp
        run: .github/scripts/check-pypi-publisher.sh
      - uses: actions/download-artifact@v8
        if: steps.tp.outputs.configured == 'true'
        with:
          name: aside-ads-client
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.tp.outputs.configured == 'true'
        with:
          skip-existing: true # re-runs after adding a missing credential stay safe

  npm:
    name: Publish aside-ads to npm
    needs: preflight
    if: needs.preflight.outputs.npm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # read by the .npmrc that setup-node writes
    defaults:
      run:
        working-directory: sdks/js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdks/js/package-lock.json
      - name: Skip if this version is already on npm
        id: existing
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          if npm view "aside-ads@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::aside-ads@$VERSION is already on npm; skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
        if: steps.existing.outputs.published == 'false'
      - run: npm run build
        if: steps.existing.outputs.published == 'false'
      - run: npm publish --provenance --access public
        if: steps.existing.outputs.published == 'false'

  docker:
    name: Publish server image to GHCR
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/pritom14/aside-ads
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
