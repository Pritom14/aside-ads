# Fly.io config for the hosted Aside demo (ad server + chat demo on one port).
# See deploy/README.md. Replace `aside-demo` with your app name, then:
#   fly apps create aside-demo
#   fly deploy --ha=false        # exactly one machine: the demo keeps its data in that machine
app = "aside-demo"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"
  build-target = "demo"

[env]
  PORT = "8080"
  # ASIDE_DEMO_DASHBOARD = "1"   # expose /dashboard; log in with the admin key from `fly logs`
  # LLM_BASE_URL, LLM_MODEL: optional real model. Put LLM_API_KEY in `fly secrets set`.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

# The local embedding model needs about 250 MB; 512 MB leaves headroom.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
