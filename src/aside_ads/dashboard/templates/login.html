{% extends "base.html" %}
{% set hide_nav = true %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  <p class="muted">Paste an admin API key. Create one with <code>aside create-key --role admin</code>.</p>
  <form method="post" action="/dashboard/login">
    <label>Admin key <input type="password" name="key" autocomplete="off" required autofocus></label>
    <button>Log in</button>
  </form>
</section>
{% endblock %}
