# For contributors: `alembic revision --autogenerate -m "..."` and `alembic upgrade head`.
# Users run `aside migrate` (or nothing: `aside serve` migrates PostgreSQL on startup).
# The database URL comes from DATABASE_URL / ASIDE_DATABASE_URL.
[alembic]
script_location = aside_ads:migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
