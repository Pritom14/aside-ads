[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "aside-ads-client"
dynamic = ["version"]
description = "Python client for Aside, the self-hosted ad server for AI chat apps."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Pritom Mazumdar" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/Pritom14/aside-ads"
Repository = "https://github.com/Pritom14/aside-ads"
Issues = "https://github.com/Pritom14/aside-ads/issues"
Changelog = "https://github.com/Pritom14/aside-ads/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/aside_ads_client/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aside_ads_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
